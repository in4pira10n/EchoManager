<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="color-scheme" content="light dark"><meta name="theme-color" content="#1a1a1a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="EchoManager"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/static/assets/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/static/assets/favicon-32.png"><link rel="apple-touch-icon" sizes="180x180" href="/static/assets/apple-touch-icon.png"><title data-i18n="auth.loginTitle"></title><link rel="stylesheet" href="/auth.css"><script defer src="/auth.js"></script><script defer src="/pwa.js"></script></head>
<body class="login-page" data-auth-page="login">
<script src="/static/i18n.js"></script>
<main class="auth-screen"><section class="auth-stage" aria-hidden="true"></section><section class="auth-pane" data-i18n-aria="auth.loginAria">
<div class="auth-brand"><img src="/static/assets/echomanager-icon.png" alt=""><p><span data-i18n="auth.welcome"></span><br><strong data-i18n="auth.loginTitle"></strong></p></div>
<div class="auth-fields"><div class="auth-field"><label for="username" data-i18n="auth.username"></label><input id="username" autocomplete="username" data-i18n-placeholder="auth.username"></div><div class="auth-field"><label for="password" data-i18n="device.password"></label><input id="password" type="password" autocomplete="current-password" data-i18n-placeholder="device.password"></div></div>
<div class="auth-error" id="auth-error" role="alert"></div></section></main>
<button class="auth-submit auth-submit-icon" id="auth-submit" type="button" data-i18n-aria="auth.loginAria" data-i18n-title="auth.loginAria"><img src="/static/assets/login.svg" alt=""><span class="auth-visually-hidden" data-i18n="auth.loginAria"></span></button>
<a class="timeline-order-btn" id="register-btn" href="/register" data-i18n-aria="auth.registerLink" data-i18n-title="auth.registerLink"><img src="/static/assets/register.svg" alt=""></a>
</body></html>
