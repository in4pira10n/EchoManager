<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="color-scheme" content="light dark"><meta name="theme-color" content="#1a1a1a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="EchoManager"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/static/assets/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/static/assets/favicon-32.png"><link rel="apple-touch-icon" sizes="180x180" href="/static/assets/apple-touch-icon.png"><title data-i18n="auth.registerTitle"></title><link rel="stylesheet" href="/auth.css"><script defer src="/auth.js"></script><script defer src="/pwa.js"></script></head>
<body class="register-page" data-auth-page="register">
<script src="/static/i18n.js"></script>
<a class="timeline-order-btn" id="register-back-btn" href="/login" data-i18n-aria="auth.backLogin" data-i18n-title="auth.backLogin"><img src="/static/assets/back.svg" alt=""></a>
<main class="auth-screen"><section class="auth-stage" aria-hidden="true"></section><section class="auth-pane" data-i18n-aria="auth.registerAria">
<div class="auth-brand"><img src="/static/assets/echomanager-icon.png" alt=""><p><strong data-i18n="auth.registerTitle"></strong></p></div>
<div class="auth-fields"><div class="auth-field"><label for="username" data-i18n="auth.username"></label><input id="username" autocomplete="username" data-i18n-placeholder="auth.username"></div><div class="auth-field"><label for="password" data-i18n="device.password"></label><input id="password" type="password" autocomplete="new-password" data-i18n-placeholder="auth.passwordMin"></div><div class="auth-field"><label for="confirm-password" data-i18n="auth.confirmPassword"></label><input id="confirm-password" type="password" autocomplete="new-password" data-i18n-placeholder="auth.confirmPasswordPlaceholder"></div></div>
<div class="auth-error" id="auth-error" role="alert"></div><button class="auth-submit auth-submit-primary" id="auth-submit" type="button" data-i18n="auth.createAdmin"></button><a class="auth-link" href="/login" data-i18n="auth.existingAccount"></a>
</section></main>
<div class="auth-dialog-backdrop" id="admin-auth-modal" hidden>
<section class="auth-dialog-card" role="dialog" aria-modal="true" aria-labelledby="admin-auth-title">
<div class="auth-dialog-head"><strong id="admin-auth-title" data-i18n="auth.adminAuthorization"></strong><p data-i18n="auth.adminAuthorizationDescription"></p></div>
<div class="auth-fields"><div class="auth-field"><input id="admin-username" autocomplete="username" data-i18n-placeholder="auth.adminUsername" data-i18n-aria="auth.adminUsername"></div><div class="auth-field"><input id="admin-password" type="password" autocomplete="current-password" data-i18n-placeholder="device.password" data-i18n-aria="device.password"></div></div>
<div class="auth-error" id="admin-auth-error" role="alert"></div>
<div class="auth-dialog-actions"><button class="auth-dialog-cancel" id="admin-auth-cancel" type="button" data-i18n="common.cancel"></button><button class="auth-dialog-confirm" id="admin-auth-confirm" type="button" data-i18n="auth.confirmCreate"></button></div>
</section>
</div>
</body></html>
